<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#83cdeb"><title>Bloxcraft</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#142331;color:#f5fbff;font:14px system-ui}canvas{display:block;touch-action:none}button,select{font:inherit}.panel{background:#10222ddd;border:1px solid #ffffff36;border-radius:10px;box-shadow:0 8px 26px #06141c66;backdrop-filter:blur(8px)}#game{position:fixed;inset:0}#top{position:fixed;z-index:2;top:12px;left:12px;display:flex;gap:8px;align-items:center}#brand,#status{padding:9px 12px}#brand b{color:#8ce4a0}#hint{position:fixed;z-index:2;bottom:15px;left:50%;transform:translateX(-50%);padding:8px 12px;font-size:12px;white-space:nowrap}#cross{position:fixed;left:50%;top:50%;width:14px;height:14px;transform:translate(-50%,-50%);pointer-events:none}#cross:before,#cross:after{content:"";position:absolute;background:white;box-shadow:0 1px 3px #000}#cross:before{left:6px;width:2px;height:14px}#cross:after{top:6px;height:2px;width:14px}#welcome{position:fixed;z-index:5;inset:0;display:grid;place-items:center;background:#091622bb;padding:16px}.card{width:min(410px,100%);padding:22px}.card h1{margin:0 0 8px}.card span{color:#8ce4a0}.card p{color:#c3d6df;line-height:1.5}.card select{width:100%;margin:8px 0;padding:10px;background:#0d1c28;border:1px solid #ffffff38;color:white;border-radius:8px}.primary{width:100%;border:0;border-radius:8px;padding:12px;background:#7de09a;color:#10271a;font-weight:800;cursor:pointer}.hidden{display:none!important}.toast{position:fixed;z-index:4;top:65px;left:50%;transform:translateX(-50%);padding:8px 12px;opacity:0;transition:opacity .2s}.toast.show{opacity:1}#hotbar{position:fixed;z-index:2;left:50%;bottom:54px;transform:translateX(-50%);display:flex;gap:4px;padding:5px}.slot{width:40px;height:40px;display:grid;place-items:center;border:1px solid #ffffff35;border-radius:6px;background:#ffffff0b;position:relative;font-size:19px}.slot.active{outline:2px solid white}.slot small{position:absolute;left:3px;top:1px;font-size:9px}.slot b{position:absolute;right:2px;bottom:0;font-size:10px}
</style></head><body><div id="game"></div><div id="cross"></div><header id="top"><div id="brand" class="panel">🧱 <b>Blox</b>craft</div><div id="status" class="panel">Choose a mode</div></header><div id="hotbar" class="panel"></div><div id="hint" class="panel">WASD / arrows move · Space jump · Click mine/attack · Right-click place · P camera · Esc unlock</div><section id="welcome"><div class="card panel"><h1>Welcome to <span>Bloxcraft</span></h1><p>Block collision is enabled in survival and peaceful modes. Creative mode lets you fly freely.</p><label>Game mode<select id="mode"><option value="survival">Survival</option><option value="creative">Creative</option><option value="peaceful">Peaceful</option></select></label><button id="play" class="primary">Play</button></div></section><div id="toast" class="toast panel"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';
const $=s=>document.querySelector(s),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;$('#game').append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x87d5ef);scene.fog=new THREE.Fog(0x87d5ef,28,75);const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,110);scene.add(new THREE.HemisphereLight(0xe4f7ff,0x596c42,1.8));const sun=new THREE.DirectionalLight(0xffedcc,2.4);sun.position.set(-20,35,15);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
function tex(c,a){const cv=document.createElement('canvas');cv.width=cv.height=32;const g=cv.getContext('2d');g.fillStyle=c;g.fillRect(0,0,32,32);for(let i=0;i<55;i++){g.globalAlpha=.16;g.fillStyle=i%2?a:'#fff';g.fillRect(Math.random()*32,Math.random()*32,2+Math.random()*3,2+Math.random()*3)}g.globalAlpha=1;const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;t.magFilter=THREE.NearestFilter;return new THREE.MeshLambertMaterial({map:t})}const mats={grass:tex('#70b54d','#344f32'),dirt:tex('#806044','#4a382c'),stone:tex('#858b8e','#4e5558'),wood:tex('#9b673b','#593b27'),leaves:tex('#398449','#1e592e'),sand:tex('#d8c17a','#a58b4f')};const blocks=new Map(),blockGroup=new THREE.Group(),cube=new THREE.BoxGeometry(1,1,1),K=(x,y,z)=>`${x},${y},${z}`;scene.add(blockGroup);
function addBlock(x,y,z,type,save=true){const id=K(x,y,z);if(blocks.has(id))return;const m=new THREE.Mesh(cube,mats[type]||mats.stone);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;m.userData={x,y,z,type};blockGroup.add(m);blocks.set(id,m);if(save)saveWorld()}function removeBlock(m){blockGroup.remove(m);blocks.delete(K(m.userData.x,m.userData.y,m.userData.z));saveWorld()}function saveWorld(){try{localStorage.setItem('bloxcraft-collision-world',JSON.stringify([...blocks].map(([k,m])=>[k,m.userData.type])))}catch{}}
function surface(x,z){return Math.floor(2+Math.sin(x*.2)*1.5+Math.cos(z*.18)*1.3)}for(let x=-18;x<=18;x++)for(let z=-18;z<=18;z++){const h=surface(x,z),type=x>9?'sand':x< -8?'leaves':'grass';for(let y=-5;y<=h;y++)addBlock(x,y,z,y===h?type:y>h-3?'dirt':'stone',false)}try{const saved=JSON.parse(localStorage.getItem('bloxcraft-collision-world')||'null');if(saved)for(const[k,t]of saved){const old=blocks.get(k);if(old){blockGroup.remove(old);blocks.delete(k)}addBlock(...k.split(',').map(Number),t,false)}}catch{}
const names=['grass','dirt','stone','wood','leaves','sand'],icons=['🟩','🟫','⬜','🪵','🌿','🟨'],counts=Object.fromEntries(names.map(n=>[n,0]));let selected=0;function renderBar(){const h=$('#hotbar');h.replaceChildren();names.forEach((n,i)=>{const s=document.createElement('div');s.className='slot'+(i===selected?' active':'');s.innerHTML=`<small>${i+1}</small>${icons[i]}<b>${counts[n]||0}</b>`;h.append(s)})}renderBar();
const player={pos:new THREE.Vector3(0,surface(0,0)+2.2,0),vel:new THREE.Vector3(),yaw:0,pitch:0,onGround:false};camera.position.copy(player.pos);let mode='survival',thirdPerson=false;const keys={};const aliases={ArrowUp:'KeyW',ArrowDown:'KeyS',ArrowLeft:'KeyA',ArrowRight:'KeyD'};function isSolidAt(x,y,z){return blocks.has(K(x,y,z))}const radius=.3,bodyBottom=1.6,bodyTop=.18;
// Player position is the camera/eye point. Test the player's full upright AABB
// against voxel AABBs and resolve movement separately on each axis.
function collidesAt(px,py,pz){const minX=px-radius,maxX=px+radius,minY=py-bodyBottom,maxY=py+bodyTop,minZ=pz-radius,maxZ=pz+radius;for(let x=Math.floor(minX+.5);x<=Math.floor(maxX+.5);x++)for(let y=Math.floor(minY+.5);y<=Math.floor(maxY+.5);y++)for(let z=Math.floor(minZ+.5);z<=Math.floor(maxZ+.5);z++){if(!isSolidAt(x,y,z))continue;if(maxX>x-.5&&minX<x+.5&&maxY>y-.5&&minY<y+.5&&maxZ>z-.5&&minZ<z+.5)return true}return false}
function moveAxis(axis,amount){if(!amount)return;const steps=Math.max(1,Math.ceil(Math.abs(amount)/.18)),step=amount/steps;for(let i=0;i<steps;i++){const p=player.pos.clone();p[axis]+=step;if(!collidesAt(p.x,p.y,p.z)){player.pos[axis]=p[axis];continue}if(axis==='y'){if(step<0)player.onGround=true;player.vel.y=0}break}}
function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1200)}$('#play').onclick=()=>{mode=$('#mode').value;$('#status').textContent=mode[0].toUpperCase()+mode.slice(1)+' · collisions on';$('#welcome').classList.add('hidden');renderer.domElement.requestPointerLock?.()};window.addEventListener('keydown',e=>{if(aliases[e.code]){e.preventDefault();keys[aliases[e.code]]=true}keys[e.code]=true;if(/^Digit[1-6]$/.test(e.code)){selected=Number(e.code.slice(5))-1;renderBar()}if(e.code==='KeyP'){thirdPerson=!thirdPerson;toast(thirdPerson?'Third person':'First person')}});window.addEventListener('keyup',e=>{keys[e.code]=false;if(aliases[e.code])keys[aliases[e.code]]=false});document.addEventListener('mousemove',e=>{if(document.pointerLockElement!==renderer.domElement)return;player.yaw-=e.movementX*.002;player.pitch=Math.max(-1.35,Math.min(1.35,player.pitch-e.movementY*.002))});
const ray=new THREE.Raycaster();ray.far=6;function hitBlock(){ray.setFromCamera(new THREE.Vector2(0,0),camera);return ray.intersectObjects(blockGroup.children,false)[0]}window.addEventListener('contextmenu',e=>e.preventDefault());window.addEventListener('mousedown',e=>{if(document.pointerLockElement!==renderer.domElement)return;const hit=hitBlock();if(!hit)return;if(e.button===0){const t=hit.object.userData.type;removeBlock(hit.object);counts[t]=(counts[t]||0)+1;renderBar()}else if(e.button===2){const n=hit.face.normal.clone().transformDirection(hit.object.matrixWorld),p=hit.object.position.clone().add(n),x=Math.round(p.x),y=Math.round(p.y),z=Math.round(p.z),type=names[selected];if(!blocks.has(K(x,y,z))&&(mode==='creative'||counts[type]>0)){addBlock(x,y,z,type);if(mode!=='creative')counts[type]--;renderBar()}}});
let last=performance.now();function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.05);last=now;if(document.pointerLockElement===renderer.domElement&&mode!=='creative'){const forward=new THREE.Vector3(-Math.sin(player.yaw),0,-Math.cos(player.yaw)),right=new THREE.Vector3(Math.cos(player.yaw),0,-Math.sin(player.yaw)),move=new THREE.Vector3();if(keys.KeyW)move.add(forward);if(keys.KeyS)move.sub(forward);if(keys.KeyD)move.add(right);if(keys.KeyA)move.sub(right);if(move.lengthSq())move.normalize();const distance=4.8*dt;moveAxis('x',move.x*distance);moveAxis('z',move.z*distance);player.onGround=false;player.vel.y-=18*dt;if(keys.Space&&player.onGround)player.vel.y=7;moveAxis('y',player.vel.y*dt);if(player.pos.y< -4){player.pos.set(0,surface(0,0)+2.2,0);player.vel.set(0,0,0)}}else if(document.pointerLockElement===renderer.domElement&&mode==='creative'){const f=new THREE.Vector3(-Math.sin(player.yaw),0,-Math.cos(player.yaw)),r=new THREE.Vector3(Math.cos(player.yaw),0,-Math.sin(player.yaw));if(keys.KeyW)player.pos.addScaledVector(f,8*dt);if(keys.KeyS)player.pos.addScaledVector(f,-8*dt);if(keys.KeyD)player.pos.addScaledVector(r,8*dt);if(keys.KeyA)player.pos.addScaledVector(r,-8*dt);if(keys.Space)player.pos.y+=8*dt;if(keys.ShiftLeft)player.pos.y-=8*dt}const eye=new THREE.Vector3(player.pos.x,player.pos.y,player.pos.z);if(thirdPerson){const back=new THREE.Vector3(Math.sin(player.yaw)*4,1.4,Math.cos(player.yaw)*4);camera.position.copy(eye).add(back);camera.lookAt(eye)}else{camera.position.copy(eye);camera.rotation.order='YXZ';camera.rotation.set(player.pitch,player.yaw,0)}renderer.render(scene,camera)}requestAnimationFrame(frame);window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
